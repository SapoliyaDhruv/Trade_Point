<div class="admin-page">
  <div class="page-head">
    <h2>Manage Categories</h2>
    <p>Activate or deactivate product categories.</p>
  </div>

  <div class="card" *ngIf="categories.length > 0; else emptyState">
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Status</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let c of categories">
            <td>{{ c.name }}</td>
            <td>
              <span class="badge" [class.active]="c.status === 'active'" [class.inactive]="c.status === 'inactive'">
                {{ c.status | titlecase }}
              </span>
            </td>
            <td>
              <button
                type="button"
                (click)="toggleStatus(c)"
                [class.btn-active]="c.status === 'inactive'"
                [class.btn-inactive]="c.status === 'active'"
              >
                {{ c.status === 'active' ? 'Deactivate' : 'Activate' }}
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <ng-template #emptyState>
    <div class="empty">No categories found.</div>
  </ng-template>
</div>
