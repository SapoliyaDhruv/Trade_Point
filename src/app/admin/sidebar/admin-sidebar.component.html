<!-- admin-sidebar.component.html -->

<nav class="admin-sidebar">
  <button
    class="sidebar-handle"
    type="button"
    (click)="toggleSidebar()"
    [attr.aria-label]="isCollapsed ? 'Expand sidebar' : 'Collapse sidebar'"
    [attr.title]="isCollapsed ? 'Expand sidebar' : 'Collapse sidebar'"
  >
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 12h18"></path>
      <path d="M10 6l-6 6 6 6"></path>
    </svg>
  </button>

  <!-- Glowing ambient light effect at top -->
  <div class="sidebar-glow"></div>

  <!-- ─── HEADER ─── -->
  <div class="sidebar-header">
    <div class="header-content">
      <div class="header-icon-wrap">
        <svg class="header-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7" rx="1"/>
          <rect x="14" y="3" width="7" height="7" rx="1"/>
          <rect x="3" y="14" width="7" height="7" rx="1"/>
          <rect x="14" y="14" width="7" height="7" rx="1"/>
        </svg>
      </div>
      <div class="header-text">
        <span class="header-title">Admin</span>
        <span class="header-subtitle">Panel</span>
      </div>
    </div>
    <button
      class="sidebar-toggle"
      type="button"
      (click)="toggleSidebar()"
      [attr.aria-label]="isCollapsed ? 'Expand sidebar' : 'Collapse sidebar'"
    >
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 12h18"></path>
        <path d="M10 6l-6 6 6 6"></path>
      </svg>
    </button>
  </div>

  <!-- ─── MENU ─── -->
  <ul class="menu">

    <!-- Dashboard -->
    <li class="menu-item">
      <a routerLink="/admin/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}">
        <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="9" rx="1"/>
          <rect x="14" y="3" width="7" height="5" rx="1"/>
          <rect x="14" y="12" width="7" height="9" rx="1"/>
          <rect x="3" y="16" width="7" height="5" rx="1"/>
        </svg>
        <span>Dashboard</span>
      </a>
    </li>

    <!-- Manage Users -->
    <li class="menu-item">
      <a routerLink="/admin/manage-users" routerLinkActive="active">
        <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="9" cy="7" r="4"/>
          <path d="M3 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/>
          <circle cx="17" cy="9" r="2.5"/>
          <path d="M23 21v-1.5a3 3 0 0 0-3-3h-.5"/>
        </svg>
        <span>Manage Users</span>
      </a>
    </li>

    <!-- Divider -->
    <li class="menu-divider"></li>

    <!-- Categories (collapsible) -->
    <li class="menu-group">
      <div class="menu-title" (click)="toggleCategory()" [class.active-group]="isCategoryOpen">
        <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
        </svg>
        <span>Categories</span>
        <svg class="arrow" [class.rotate]="isCategoryOpen" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" width="14" height="14">
          <polyline points="6 9 12 15 18 9"/>
        </svg>
      </div>
      <ul class="submenu" [class.submenu-open]="isCategoryOpen">
        <li>
          <a routerLink="/admin/category/add" routerLinkActive="active">
            <svg class="submenu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/>
              <line x1="12" y1="8" x2="12" y2="16"/>
              <line x1="8" y1="12" x2="16" y2="12"/>
            </svg>
            <span>Add Category</span>
          </a>
        </li>
        <li>
          <a routerLink="/admin/category/manage" routerLinkActive="active">
            <svg class="submenu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <line x1="9" y1="18" x2="15" y2="18"/>
              <line x1="10" y1="22" x2="14" y2="22"/>
              <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
            </svg>
            <span>Manage Categories</span>
          </a>
        </li>
      </ul>
    </li>

    <!-- Products (collapsible) -->
    <li class="menu-group">
      <div class="menu-title" (click)="toggleProduct()" [class.active-group]="isProductOpen">
        <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="9" cy="21" r="1"/>
          <circle cx="20" cy="21" r="1"/>
          <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
        </svg>
        <span>Products</span>
        <svg class="arrow" [class.rotate]="isProductOpen" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" width="14" height="14">
          <polyline points="6 9 12 15 18 9"/>
        </svg>
      </div>
      <ul class="submenu" [class.submenu-open]="isProductOpen">
        <li>
          <a routerLink="/admin/products/approve" routerLinkActive="active">
            <svg class="submenu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
              <polyline points="22 4 12 14.01 9 11.01"/>
            </svg>
            <span>Approve Products</span>
          </a>
        </li>
        <li>
          <a routerLink="/admin/products/manage" routerLinkActive="active">
            <svg class="submenu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="3" width="20" height="14" rx="2" ry="2"/>
              <line x1="8" y1="21" x2="16" y2="21"/>
              <line x1="12" y1="17" x2="12" y2="21"/>
            </svg>
            <span>Manage Products</span>
          </a>
        </li>
      </ul>
    </li>

    <!-- Divider -->
    <li class="menu-divider"></li>

    <!-- Pending Payments -->
    <li class="menu-item">
      <a routerLink="/admin/pending-transactions" routerLinkActive="active" class="pending-payments-link">
        <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="1" y="4" width="22" height="16" rx="2" ry="2"/>
          <line x1="1" y1="10" x2="23" y2="10"/>
        </svg>
        <span>Pending Payments</span>
      </a>
    </li>

    <!-- Earnings Reports -->
    <li class="menu-item">
      <a routerLink="/admin/reports/earnings" routerLinkActive="active">
        <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="20" x2="18" y2="10"/>
          <line x1="12" y1="20" x2="12" y2="4"/>
          <line x1="6" y1="20" x2="6" y2="14"/>
        </svg>
        <span>Earnings Reports</span>
      </a>
    </li>

    <!-- Audit Logs -->
    <li class="menu-item">
      <a routerLink="/admin/audit-logs" routerLinkActive="active">
        <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="16" y1="13" x2="8" y2="13"/>
          <line x1="16" y1="17" x2="8" y2="17"/>
          <polyline points="10 9 9 9 8 9"/>
        </svg>
        <span>Audit Logs</span>
      </a>
    </li>

    <!-- Admin Chat -->
    <li class="menu-item">
      <a routerLink="/admin/chat" routerLinkActive="active">
        <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15a4 4 0 0 1-4 4H7l-4 4V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z"/>
          <line x1="8" y1="9" x2="16" y2="9"/>
          <line x1="8" y1="13" x2="14" y2="13"/>
        </svg>
        <span>Admin Chat</span>
      </a>
    </li>

    <!-- Profile -->
    <li class="menu-item">
      <a routerLink="/admin/profile" routerLinkActive="active">
        <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="8" r="4"/>
        </svg>
        <span>Profile</span>
      </a>
    </li>

  </ul>

  <!-- ─── FOOTER / USER CARD ─── -->
  <div class="sidebar-footer">
    <div class="profile-card">
      <div class="profile-img-wrap">
        <img [src]="profileImageUrl" alt="Admin Profile" class="sidebar-profile-img" />
        <span class="online-dot"></span>
      </div>
      <div class="profile-info">
        <span class="profile-name">{{ adminName || 'Admin' }}</span>
        <span class="profile-role">{{ adminRole }}</span>
      </div>
    </div>
    <button class="logout" (click)="logout()" aria-label="Logout">
      <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
        <polyline points="16 17 21 12 16 7"/>
        <line x1="21" y1="12" x2="9" y2="12"/>
      </svg>
      <span>Logout</span>
    </button>
  </div>

</nav>
